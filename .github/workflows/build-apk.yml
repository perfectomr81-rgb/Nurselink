name: Build NurseLink Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a downloadable Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Works whether you uploaded the project files normally OR just the
      # original AI Studio .zip file (handy when you only have a phone).
      - name: Locate project (unzip if needed)
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            ROOT="$PWD"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::No settings.gradle.kts and no .zip found in the repo root."
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            SETTINGS=$(find "$RUNNER_TEMP/proj" -maxdepth 3 -name settings.gradle.kts | head -n1)
            ROOT=$(dirname "$SETTINGS")
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          ls -la "$ROOT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform (compileSdk 36.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" || sdkmanager "platforms;android-36" || true

      # The project has no gradlew / gradle-wrapper.jar, so use Gradle 9.3.1
      # (the exact version in gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # app/build.gradle.kts points the debug build at ROOT/debug.keystore,
      # but that file is git-ignored by AI Studio, so create it here.
      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n1)
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/NurseLink-debug.apk"
          echo "APK_PATH=$RUNNER_TEMP/NurseLink-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NurseLink-debug-apk
          path: ${{ env.APK_PATH }}

      # Easiest on a phone: a Release page with a direct APK download link.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: NurseLink debug build #${{ github.run_number }}
          prerelease: true
          files: ${{ env.APK_PATH }}
